{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="{% static 'css/inscription.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-blue-dark: #1e40af;
            --accent-blue: #60a5fa;
            --background: #f9fbfd;
            --white: #fff;
            --gray: #f3f4f6;
            --border: #e5e7eb;
            --text: #1e293b;
            --danger: #ef4444;
        }
        body {
            background: var(--background);
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text);
            margin: 0;
        }
        .form-container {
            max-width: 410px;
            margin: 60px auto;
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 6px 36px rgba(37,99,235,0.16), 0 1.5px 6px rgba(30,64,175,0.07);
            padding: 36px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo {
            max-width: 100px;
            border-radius: 50%;
        }
        h2 {
            color: var(--primary-blue-dark);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        label {
            font-weight: 500;
            margin-bottom: 3px;
            display: block;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--gray);
            font-size: 1rem;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: #eef4ff;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-blue));
            color: var(--white);
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--primary-blue-dark);
        }
        .alert {
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            font-size: 0.97rem;
            background: #f1f5f9;
            color: var(--danger);
        }
        .alert-success { color: #10b981; background: #dcfce7; }
        .alert-info    { color: #2563eb; background: #dbeafe; }
        .alert-warning { color: #f59e42; background: #fff7ed; }
        .alert-error,
        .alert-danger  { color: var(--danger); background: #fef2f2; }

        .link-action {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: var(--primary-blue);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.18s;
        }
        .link-action:hover {
            color: var(--primary-blue-dark);
            text-decoration: underline;
        }
        .return-home {
            display: block;
            background: var(--gray);
            color: var(--primary-blue-dark);
            border-radius: 5px;
            box-shadow: 0 1.5px 6px rgba(30,64,175,0.06);
            text-align: center;
            margin: 0.8rem auto 0;
            width: fit-content;
            padding: 8px 20px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.18s;
        }
        .return-home:hover {
            background: var(--accent-blue);
            color: var(--white);
        }
    </style>
</head>
<body>
<div class="form-container">
    
    <div class="logo-container">
        <a href="{% url 'welcome' %}">
            <img src="{% static 'img/logo/logo2.jpg' %}" alt="Logo" class="logo">
        </a>
    </div>

    <h2>Connexion</h2>
    <form method="post">
        {% csrf_token %}
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre e-mail" required>

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Entrez votre mot de passe" required>

        {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <button type="submit">Se connecter</button>
    </form>

    <a href="{% url 'inscription' %}" class="link-action">
        Vous n'avez pas de compte ? Inscrivez-vous
    </a>
    <a href="{% url 'welcome' %}" class="return-home">⬅ Retour à l'accueil</a>

</div>
</body>
</html>
