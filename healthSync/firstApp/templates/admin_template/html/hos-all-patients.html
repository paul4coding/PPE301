{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Multipurpose Dashboard</title>
    <meta content="" name="description" />
    <meta content="" name="author" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'admin/assets/images/favicon.png' %}" type="image/x-icon" />
    <link rel="apple-touch-icon-precomposed" href="{% static 'admin/assets/images/apple-touch-icon-57-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="114x114" href="{% static 'admin/assets/images/apple-touch-icon-114-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="72x72" href="{% static 'admin/assets/images/apple-touch-icon-72-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{% static 'admin/assets/images/apple-touch-icon-144-precomposed.png' %}">

    <!-- CORE CSS FRAMEWORK - START -->
    <link href="{% static 'admin/assets/plugins/pace/pace-theme-flash.css' %}" rel="stylesheet" type="text/css" media="screen" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap-theme.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/font-awesome/css/font-awesome.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/webfont/cryptocoins.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/animate.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/style.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/responsive.css' %}" rel="stylesheet" type="text/css" />
    <style>
        .pagination-custom {
            display: flex;
            justify-content: center;
            margin: 30px 0 10px 0;
            padding-left: 0;
            list-style: none;
        }
        .pagination-custom li {
            margin: 0 4px;
        }
        .pagination-custom li a,
        .pagination-custom li span {
            color: #007bff;
            background: #fff;
            border: 1px solid #007bff;
            border-radius: 4px;
            padding: 7px 16px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            display: block;
            cursor: pointer;
        }
        .pagination-custom li.active span,
        .pagination-custom li a:hover {
            background: #007bff;
            color: #fff;
        }
        .pagination-custom li.disabled span {
            color: #aaa;
            border-color: #eee;
            background: #f9f9f9;
            cursor: not-allowed;
        }
        .search-bar-patient {
            max-width: 400px;
            margin: 20px 0 30px 0;
        }
    </style>
</head>
<body class=" ">

    {% include "admin_template/partials/_header.html" %}
    <div class="page-container row-fluid container-fluid">
        {% include "admin_template/partials/_sidebar.html" %}
        <section id="main-content" class=" ">
            <div class="wrapper main-wrapper row" style=''>

                <div class='col-xs-12'>
                    <div class="page-title">
                        <div class="pull-left">
                            <h1 class="title">Tous les patients</h1>
                        </div>
                    </div>
                    <!-- Barre de recherche dynamique -->
                    <div class="form-group search-bar-patient">
                        <input type="text" id="search-patient" class="form-control" placeholder="Rechercher par nom...">
                    </div>
                </div>

                <div class="clearfix"></div>
                <!-- MAIN CONTENT AREA STARTS -->

                <div id="patients-list">
                    <!-- Les patients seront affichés ici par JS -->
                </div>
                <div class="col-xs-12">
                    <ul class="pagination-custom" id="patients-pagination"></ul>
                </div>
                <div class="clearfix"></div>
            </div>
        </section>
        <!-- END CONTENT -->
        <div class="page-chatapi hideit">
            <!-- ... le reste ... -->
        </div>
        <div class="chatapi-windows "></div>
    </div>
    <!-- END CONTAINER -->
    <!-- CORE JS FRAMEWORK - START -->
    <script src="{% static 'admin/assets/js/jquery.min.js' %}"></script>
    <script src="{% static 'admin/assets/js/jquery.easing.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/pace/pace.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/viewport/viewportchecker.js' %}"></script>
    <script>
        window.jQuery || document.write('<script src="{% static 'admin/assets/js/jquery.min.js' %}"><\/script>');
    </script>
    <script src="{% static 'admin/assets/js/scripts.js' %}"></script>
    <script>
        // Récupère les patients du contexte Django
        const allPatients = [
            {% for patient in patients %}
            {
                id: "{{ patient.id }}",
                nom: "{{ patient.nom|escapejs }}",
                prenom: "{{ patient.prenom|escapejs }}",
                age: "{{ patient.age|default:'' }}",
                date_naissance: "{{ patient.date_naissance|date:'Y-m-d' }}",
                sexe: "{% if patient.sexe == 'M' %}Masculin{% elif patient.sexe == 'F' %}Féminin{% else %}{{ patient.sexe }}{% endif %}",
                photo: "{% if patient.photo %}{{ patient.photo.url }}{% else %}{% static 'admin/data/profile/1430504.png' %}{% endif %}",
                profile_url: "{% url 'hos_patient_profile' patient.id %}",
                edit_url: "{% url 'hos_edit_patient' patient.id %}",
                delete_url: "{% url 'hos_delete_patient' patient.id %}"
            },
            {% endfor %}
        ];
        const perPage = 6;
        let currentPage = 1;
        let filteredPatients = allPatients.slice();

        // Fonction pour calculer l'âge à partir de la date de naissance (format YYYY-MM-DD)
        function getAge(dateString) {
            if (!dateString) return null;
            const today = new Date();
            const birthDate = new Date(dateString);
            if (isNaN(birthDate.getTime())) return null;
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function renderPatients(patients) {
            let html = '';
            if (patients.length === 0) {
                html = `<div class="col-xs-12"><div class="alert alert-info text-center">Aucun patient trouvé.</div></div>`;
            } else {
                patients.forEach(patient => {
                    // Calcul dynamique de l'âge
                    let ageToShow = '-';
                    if (patient.date_naissance) {
                        const age = getAge(patient.date_naissance);
                        ageToShow = (age !== null && age >= 0) ? age : (patient.age ? patient.age : '-');
                    } else if (patient.age) {
                        ageToShow = patient.age;
                    }
                    html += `
                    <div class="col-lg-4 col-md-6">
                        <section class="box ">
                            <div class="content-body p">
                                <div class="row">
                                    <div class="doctors-list patient relative">
                                        <div class="doctors-head relative text-center">
                                            <div class="patient-img img-circle">
                                                <img src="${patient.photo}" alt="" style="width:120px;height:120px;object-fit:cover;border-radius:50%;display:block;margin:0 auto;background:#f2f2f2;">
                                                <div class="stutas recent"></div>
                                            </div>
                                            <h3 class="header w-text relative bold">Nom : ${patient.nom} ${patient.prenom}</h3>
                                        </div>
                                        <div class="row">
                                            <div class="patients-info relative" >
                                                <div class="col-sm-6 col-xs-12">
                                                    <div class="patient-card has-shadow2">
                                                        <div class="doc-info-wrap">
                                                            <div class="patient-info">
                                                                <h5 class="bold">${patient.sexe}</h5>
                                                                <h6>Genre du Patient(e)</h6>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 col-xs-12">
                                                    <div class="patient-card has-shadow2">
                                                        <div class="doc-info-wrap">
                                                            <div class="patient-info">
                                                                <h5 class="bold">Age: ${ageToShow}</h5>
                                                                <h6>Ans</h6>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xs-12 mb-20 text-center">
                                            <div class="btn-group" role="group" aria-label="Actions patient">
                                                <a href="${patient.profile_url}" class="btn btn-primary gradient-blue" title="Voir le profil">
                                                    <i class="fa fa-user"></i>
                                                </a>
                                                <a href="${patient.edit_url}" class="btn btn-warning" title="Modifier">
                                                    <i class="fas fa-pencil-alt"></i>
                                                </a>
                                                <form action="${patient.delete_url}" method="post" style="display:inline;">
                                                    {% csrf_token %}
                                                    <button type="submit" class="btn btn-danger" title="Supprimer" onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce patient ?');">
                                                        <i class="fa fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                    `;
                });
            }
            document.getElementById('patients-list').innerHTML = html;
        }

        function renderPagination(total, page) {
            let ul = document.getElementById('patients-pagination');
            ul.innerHTML = '';
            let pages = Math.ceil(total / perPage);
            if (pages <= 1) return;
            // Previous
            ul.innerHTML += `<li class="${page === 1 ? 'disabled' : ''}">
                <span ${page === 1 ? '' : 'onclick="gotoPage(' + (page-1) + ')"'}>&laquo;</span>
            </li>`;
            // Pages
            for (let i = 1; i <= pages; i++) {
                ul.innerHTML += `<li class="${i === page ? 'active' : ''}">
                    <span onclick="gotoPage(${i})">${i}</span>
                </li>`;
            }
            // Next
            ul.innerHTML += `<li class="${page === pages ? 'disabled' : ''}">
                <span ${page === pages ? '' : 'onclick="gotoPage(' + (page+1) + ')"'}>&raquo;</span>
            </li>`;
        }

        function gotoPage(page) {
            currentPage = page;
            let start = (page - 1) * perPage;
            let end = start + perPage;
            renderPatients(filteredPatients.slice(start, end));
            renderPagination(filteredPatients.length, page);
        }

        document.addEventListener('DOMContentLoaded', function() {
            gotoPage(1);
        });

        window.gotoPage = gotoPage;

        // Recherche dynamique par nom
        document.getElementById('search-patient').addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            filteredPatients = allPatients.filter(p =>
                (p.nom + ' ' + p.prenom).toLowerCase().includes(q)
            );
            gotoPage(1);
        });
    </script>
</body>
</html>
