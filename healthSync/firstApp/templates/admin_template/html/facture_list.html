{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Liste des factures</title>
    <meta content="" name="description" />
    <meta content="" name="author" />
    <!-- Favicon et CSS -->
    <link rel="shortcut icon" href="{% static 'admin/assets/images/favicon.png' %}" type="image/x-icon" />
    <link rel="apple-touch-icon-precomposed" href="{% static 'admin/assets/images/apple-touch-icon-57-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="114x114" href="{% static 'admin/assets/images/apple-touch-icon-114-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="72x72" href="{% static 'admin/assets/images/apple-touch-icon-72-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{% static 'admin/assets/images/apple-touch-icon-144-precomposed.png' %}">
    <link href="{% static 'admin/assets/plugins/pace/pace-theme-flash.css' %}" rel="stylesheet" type="text/css" media="screen" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap-theme.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/font-awesome/css/font-awesome.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/webfont/cryptocoins.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/animate.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/style.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/responsive.css' %}" rel="stylesheet" type="text/css" />
    <style>
        .pagination { margin: 20px 0; }
        .pagination li { display: inline-block; margin: 0 2px; }
        .pagination li.active a { background: #007bff; color: #fff; }
        .search-bar { max-width: 350px; margin-bottom: 20px; }
    </style>
</head>
<body>
    {% include "admin_template/partials/_header.html" %}
    <div class="page-container row-fluid container-fluid">
        {% include "admin_template/partials/_sidebar.html" %}
        <section id="main-content">
            <div class="wrapper main-wrapper row">
                <div class="col-md-10 col-md-offset-1">
                    <div class="page-title">
                        <h1 class="title">Liste des factures</h1>
                    </div>
                    <section class="box">
                        <div class="content-body p">
                            <div class="form-group">
                                <input type="text" id="search-facture" class="form-control search-bar" placeholder="Rechercher par patient, date, type, montant...">
                            </div>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Patient</th>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Montant</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="factures-tbody">
                                    <!-- Les lignes seront générées par JS -->
                                </tbody>
                            </table>
                            <nav>
                                <ul class="pagination" id="factures-pagination"></ul>
                            </nav>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </div>
    <!-- CORE JS FRAMEWORK - START -->
    <script src="{% static 'admin/assets/js/jquery.min.js' %}"></script>
    <script src="{% static 'admin/assets/js/jquery.easing.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/pace/pace.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/viewport/viewportchecker.js' %}"></script>
    <script>
        window.jQuery || document.write('<script src="{% static 'admin/assets/js/jquery.min.js' %}"><\/script>');
    </script>
    <!-- CORE JS FRAMEWORK - END -->
    <script src="{% static 'admin/assets/js/scripts.js' %}"></script>
    <script>
    // Les factures sont injectées côté serveur dans la variable JS ci-dessous
    let allFactures = [
        {% for facture in factures %}
        {
            id: {{ facture.id }},
            patient: "{{ facture.patient|default_if_none:''|escapejs }}",
            date: "{{ facture.date|date:'d/m/Y' }}",
            type: "{{ facture.type|default_if_none:''|escapejs }}",
            total_lignes: "{{ facture.total_lignes|default_if_none:facture.frais|floatformat:0 }}",
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    let currentPage = 1;
    const perPage = 5;

    function renderFactures(factures) {
        let tbody = document.getElementById('factures-tbody');
        tbody.innerHTML = '';
        if (factures.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Aucune facture trouvée.</td></tr>';
            return;
        }
        factures.forEach(facture => {
            tbody.innerHTML += `
                <tr>
                    <td>${facture.id}</td>
                    <td>${facture.patient}</td>
                    <td>${facture.date}</td>
                    <td>${facture.type}</td>
                    <td>${facture.total_lignes} fcfa</td>
                    <td>
            <a href="/health/facture/${facture.id}/" class="btn btn-info btn-sm">Détail</a>
            <a href="/health/facture/${facture.id}/edit/" class="btn btn-warning btn-sm">Modifier</a>
            <form method="post" action="/health/facture/${facture.id}/delete/" style="display:inline;" onsubmit="return confirm('Voulez-vous vraiment supprimer cette facture ?');">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
            </form>
        </td>
                </tr>
            `;
        });
    }

    function renderPagination(total, page) {
        let ul = document.getElementById('factures-pagination');
        ul.innerHTML = '';
        let pages = Math.ceil(total / perPage);
        if (pages <= 1) return;
        for (let i = 1; i <= pages; i++) {
            ul.innerHTML += `<li class="${i === page ? 'active' : ''}">
                <a href="#" onclick="gotoPage(${i});return false;">${i}</a>
            </li>`;
        }
    }

    function getFilteredFactures() {
        const q = document.getElementById('search-facture').value.trim().toLowerCase();
        if (!q) return allFactures;
        return allFactures.filter(facture =>
            (facture.patient || '').toLowerCase().includes(q) ||
            (facture.date || '').toLowerCase().includes(q) ||
            (facture.type || '').toLowerCase().includes(q) ||
            (facture.total_lignes + '').toLowerCase().includes(q)
        );
    }

    function gotoPage(page) {
        currentPage = page;
        let start = (page - 1) * perPage;
        let end = start + perPage;
        let filtered = getFilteredFactures();
        renderFactures(filtered.slice(start, end));
        renderPagination(filtered.length, page);
    }

    document.getElementById('search-facture').addEventListener('input', function() {
        gotoPage(1);
    });

    document.addEventListener('DOMContentLoaded', function() {
        gotoPage(1);
    });

    window.gotoPage = gotoPage;
    </script>
</body>
</html>
