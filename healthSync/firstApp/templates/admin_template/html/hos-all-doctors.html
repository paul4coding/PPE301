{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Tous les médecins | Tableau de bord</title>
    <meta content="" name="description" />
    <meta content="" name="author" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'admin/assets/images/favicon.png' %}" type="image/x-icon" />
    <link rel="apple-touch-icon-precomposed" href="{% static 'admin/assets/images/apple-touch-icon-57-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="114x114" href="{% static 'admin/assets/images/apple-touch-icon-114-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="72x72" href="{% static 'admin/assets/images/apple-touch-icon-72-precomposed.png' %}">
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{% static 'admin/assets/images/apple-touch-icon-144-precomposed.png' %}">

    <!-- CORE CSS FRAMEWORK - START -->
    <link href="{% static 'admin/assets/plugins/pace/pace-theme-flash.css' %}" rel="stylesheet" type="text/css" media="screen" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/bootstrap/css/bootstrap-theme.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/font-awesome/css/font-awesome.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/fonts/webfont/cryptocoins.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/animate.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/style.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'admin/assets/css/responsive.css' %}" rel="stylesheet" type="text/css" />
    <style>
        .doctor-photo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto 10px auto;
            background: #f2f2f2;
        }
        .pagination-custom {
            display: flex;
            justify-content: center;
            margin: 30px 0 10px 0;
            padding-left: 0;
            list-style: none;
        }
        .pagination-custom li {
            margin: 0 4px;
        }
        .pagination-custom li a,
        .pagination-custom li span {
            color: #007bff;
            background: #fff;
            border: 1px solid #007bff;
            border-radius: 4px;
            padding: 7px 16px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            display: block;
            cursor: pointer;
        }
        .pagination-custom li.active span,
        .pagination-custom li a:hover {
            background: #007bff;
            color: #fff;
        }
        .pagination-custom li.disabled span {
            color: #aaa;
            border-color: #eee;
            background: #f9f9f9;
            cursor: not-allowed;
        }
        .search-bar-doctor {
            max-width: 400px;
            margin: 20px 0 30px 0;
        }
    </style>
</head>

<body>
    <!-- START TOPBAR -->
    {% include "admin_template/partials/_header.html" %}
    <!-- END TOPBAR -->

    <div class="page-container row-fluid container-fluid">
        <!-- SIDEBAR - START -->
        {% include "admin_template/partials/_sidebar.html" %}
        <!-- SIDEBAR - END -->

        <!-- START CONTENT -->
        <section id="main-content">
            <div class="wrapper main-wrapper row">

                <div class="col-xs-12">
                    <div class="page-title">
                        <div class="pull-left">
                            <h1 class="title">Tous les médecins</h1>
                        </div>
                    </div>
                    <!-- Barre de recherche dynamique -->
                    <div class="form-group search-bar-doctor">
                        <input type="text" id="search-doctor" class="form-control" placeholder="Rechercher par nom ou spécialité...">
                    </div>
                </div>
                <div class="clearfix"></div>

                <div id="doctors-list">
                    <!-- Les médecins seront affichés ici par JS -->
                </div>
                <div class="col-xs-12">
                    <ul class="pagination-custom" id="doctors-pagination"></ul>
                </div>
                <div class="clearfix"></div>
            </div>
        </section>
        <!-- END CONTENT -->
    </div>
    <!-- END CONTAINER -->

    <!-- CORE JS FRAMEWORK - START -->
    <script src="{% static 'admin/assets/js/jquery.min.js' %}"></script>
    <script src="{% static 'admin/assets/js/jquery.easing.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/pace/pace.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/perfect-scrollbar/perfect-scrollbar.min.js' %}"></script>
    <script src="{% static 'admin/assets/plugins/viewport/viewportchecker.js' %}"></script>
    <script>
        window.jQuery || document.write('<script src="{% static 'admin/assets/js/jquery.min.js' %}"><\/script>');
    </script>
    <!-- CORE JS FRAMEWORK - END -->

    <!-- CORE TEMPLATE JS - START -->
    <script src="{% static 'admin/assets/js/scripts.js' %}"></script>
    <!-- END CORE TEMPLATE JS - END -->

    <script>
        // Récupère les médecins du contexte Django
        const allDoctors = [
            {% for medecin in medecins %}
            {
                id: "{{ medecin.id }}",
                nom: "{{ medecin.nom|escapejs }}",
                prenom: "{{ medecin.prenom|escapejs }}",
                age: "{{ medecin.age|default:'' }}",
                date_naissance: "{{ medecin.date_naissance|date:'Y-m-d' }}",
                sexe: "{% if medecin.sexe == 'M' %}Masculin{% elif medecin.sexe == 'F' %}Féminin{% else %}{{ medecin.sexe }}{% endif %}",
                specialite: "{{ medecin.specialite.nom|escapejs }}",
                note: "{{ medecin.note|default_if_none:'' }}",
                photo: "{% if medecin.photo %}{{ medecin.photo.url }}{% else %}{% static 'admin/data/profile/profilDefault.jpg' %}{% endif %}",
                profile_url: "{% url 'hos_doctor_profile' medecin.id %}",
                edit_url: "{% url 'hos_edit_doctor' medecin.id %}",
                delete_url: "{% url 'hos_delete_doctor' medecin.id %}"
            },
            {% endfor %}
        ];
        const perPage = 6;
        let currentPage = 1;
        let filteredDoctors = allDoctors.slice();

        // Fonction pour calculer l'âge à partir de la date de naissance (format YYYY-MM-DD)
        function getAge(dateString) {
            if (!dateString) return null;
            const today = new Date();
            const birthDate = new Date(dateString);
            if (isNaN(birthDate.getTime())) return null;
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function renderDoctors(doctors) {
            let html = '';
            if (doctors.length === 0) {
                html = `<div class="col-xs-12"><div class="alert alert-info text-center">Aucun médecin trouvé.</div></div>`;
            } else {
                doctors.forEach(doctor => {
                    // Calcul dynamique de l'âge
                    let ageToShow = '-';
                    if (doctor.date_naissance) {
                        const age = getAge(doctor.date_naissance);
                        ageToShow = (age !== null && age >= 0) ? age : (doctor.age ? doctor.age : '-');
                    } else if (doctor.age) {
                        ageToShow = doctor.age;
                    }
                    html += `
                    <div class="col-lg-4 col-md-6">
                        <section class="box">
                            <div class="content-body p">
                                <div class="row">
                                    <div class="doctors-list patient relative">
                                        <div class="doctors-head relative text-center">
                                            <div class="doctor-card has-shadow">
                                                <div class="doc-info-wrap text-left">
                                                    <div class="doctor-img">
                                                        <img src="${doctor.photo}" alt="photo" class="doctor-photo"/>
                                                    </div>
                                                    <div class="doc-info text-center">
                                                        <h4 class="bold">${doctor.nom} ${doctor.prenom}</h4>
                                                        <h5>${doctor.specialite}</h5>
                                                        ${doctor.note ? renderStars(doctor.note) : ''}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row" style="margin-top:15px;">
                                            <div class="col-xs-6 text-center">
                                                <div>
                                                    <h5 class="bold">${doctor.sexe}</h5>
                                                    <h6>Sexe</h6>
                                                </div>
                                            </div>
                                            <div class="col-xs-6 text-center">
                                                <div>
                                                    <h5 class="bold">${ageToShow}</h5>
                                                    <h6>Âge</h6>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xs-12 text-center" style="margin-top:15px;">
                                            <div class="btn-group" role="group">
                                                <a href="${doctor.profile_url}" class="btn btn-primary" title="Voir le profil">
                                                    <i class="fa fa-user"></i>
                                                </a>
                                                <a href="${doctor.edit_url}" class="btn btn-warning" title="Modifier">
                                                    <i class="fas fa-pencil-alt"></i>
                                                </a>
                                                <form action="${doctor.delete_url}" method="post" style="display:inline;">
                                                    {% csrf_token %}
                                                    <button type="submit" class="btn btn-danger" title="Supprimer" onclick="return confirm('Supprimer ce médecin ?');">
                                                        <i class="fa fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                    `;
                });
            }
            document.getElementById('doctors-list').innerHTML = html;
        }

        function renderStars(note) {
            let n = parseFloat(note);
            let html = '<div class="doc-rating">';
            for (let i = 1; i <= 5; i++) {
                if (n >= i) {
                    html += '<i class="fa fa-star"></i>';
                } else if (n >= i - 0.5) {
                    html += '<i class="fa fa-star-half"></i>';
                } else {
                    html += '<i class="fa fa-star-o"></i>';
                }
            }
            html += ` <span>${note}</span></div>`;
            return html;
        }

        function renderPagination(total, page) {
            let ul = document.getElementById('doctors-pagination');
            ul.innerHTML = '';
            let pages = Math.ceil(total / perPage);
            if (pages <= 1) return;
            // Previous
            ul.innerHTML += `<li class="${page === 1 ? 'disabled' : ''}">
                <span ${page === 1 ? '' : 'onclick="gotoPage(' + (page-1) + ')"'}>&laquo;</span>
            </li>`;
            // Pages
            for (let i = 1; i <= pages; i++) {
                ul.innerHTML += `<li class="${i === page ? 'active' : ''}">
                    <span onclick="gotoPage(${i})">${i}</span>
                </li>`;
            }
            // Next
            ul.innerHTML += `<li class="${page === pages ? 'disabled' : ''}">
                <span ${page === pages ? '' : 'onclick="gotoPage(' + (page+1) + ')"'}>&raquo;</span>
            </li>`;
        }

        function gotoPage(page) {
            currentPage = page;
            let start = (page - 1) * perPage;
            let end = start + perPage;
            renderDoctors(filteredDoctors.slice(start, end));
            renderPagination(filteredDoctors.length, page);
        }

        document.addEventListener('DOMContentLoaded', function() {
            gotoPage(1);
        });

        window.gotoPage = gotoPage;

        // Recherche dynamique par nom ou spécialité
        document.getElementById('search-doctor').addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            filteredDoctors = allDoctors.filter(d =>
                (d.nom + ' ' + d.prenom + ' ' + d.specialite).toLowerCase().includes(q)
            );
            gotoPage(1);
        });
    </script>
</body>
</html>
